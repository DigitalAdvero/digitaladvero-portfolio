<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stranica nije pronađena — DigitalAdvero</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05060b">
  <link rel="icon" href="/assets/images/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .nf{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:40px 24px;position:relative;z-index:2}
    .nf__code{font-family:var(--serif);font-style:italic;font-size:clamp(120px,24vw,320px);line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(220,228,255,.35)}
    .nf h1{margin-top:18px;font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,64px);line-height:1}
    .nf p{margin:18px auto 30px;max-width:460px;color:var(--ink-2)}
    .nf__core{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(61,107,255,.45),transparent 65%)}
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <main class="nf">
    <div>
      <div class="nf__core" aria-hidden="true"></div>
      <p class="nf__code" aria-hidden="true">404</p>
      <h1>Ova stranica ne postoji.</h1>
      <p>Moguće je da je link pogrešan ili da je stranica premještena. Vratite se na početak i nastavite istraživati.</p>
      <a class="btn btn--primary" href="/"><span>Nazad na DigitalAdvero</span></a>
    </div>
  </main>
</body>
</html>
