<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stranica nije pronađena — DigitalAdvero</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08060a">
  <link rel="icon" href="/assets/images/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .nf{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:40px 24px;position:relative}
    .nf__ring{position:absolute;left:50%;top:50%;width:min(70vmin,560px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
      background:radial-gradient(circle,#2a5cff 0 9%,#1f4dff 10%,rgba(31,77,255,.25) 15%,transparent 19%),repeating-radial-gradient(circle,rgba(255,255,255,.08) 0 3px,transparent 3px 30px);
      -webkit-mask:radial-gradient(circle,#000 60%,transparent 71%);mask:radial-gradient(circle,#000 60%,transparent 71%);opacity:.8}
    .nf__inner{position:relative}
    .nf h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,7vw,96px);line-height:.95;letter-spacing:-.02em}
    .nf p{margin:18px auto 0;max-width:420px;color:var(--ink-2)}
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf__ring" aria-hidden="true"></div>
    <div class="nf__inner">
      <h1>Ovaj ekran nije<br>na zidu.</h1>
      <p>Stranica koju tražite ne postoji ili je premještena.</p>
      <a class="j-btn" href="/">Nazad na DigitalAdvero <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </main>
</body>
</html>
